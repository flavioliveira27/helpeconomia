services:
  mysql:
    image: mysql:8.0
    container_name: finansmart_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Castr0@2715
      MYSQL_DATABASE: helpeconomia
      MYSQL_USER: finansmart_user
      MYSQL_PASSWORD: finansmart_pass_2024
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - finansmart_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: finansmart_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_USER: finansmart_user
      DB_PASSWORD: finansmart_pass_2024
      DB_NAME: helpeconomia
      DB_PORT: 3306
      JWT_SECRET: finansmart_secret_key_2024_super_secure
      GEMINI_API_KEY: AIzaSyAf26DSPV2qwDwAL-9N2b6j1aMenqIK-N0
      PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - finansmart_network
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build: .
    container_name: finansmart_frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - finansmart_network

volumes:

  backend_node_modules:


networks:
  finansmart_network:
    driver: bridge
