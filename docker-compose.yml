version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: helpeconomia_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Castr0@2715
      MYSQL_DATABASE: helpeconomia
      MYSQL_USER: finansmart_user
      MYSQL_PASSWORD: finansmart_pass_2024
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - helpeconomia_internal
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  backend:
    build: ./backend
    container_name: helpeconomia_backend
    ports:
      - "5001:5000"
    environment:
      DB_HOST: mysql
      DB_USER: finansmart_user
      DB_PASSWORD: finansmart_pass_2024
      DB_NAME: helpeconomia
      DB_PORT: 3306
      JWT_SECRET: finansmart_secret_key_2024_super_secure
      GEMINI_API_KEY: AIzaSyAf26DSPV2qwDwAL-9N2b6j1aMenqIK-N0
      PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - helpeconomia_internal
      - nginx-proxy-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  frontend:
    build:
      context: .
      target: production
      args:
        - VITE_API_URL=https://api.helpeconomia.com.br
    container_name: helpeconomia_frontend
    ports:
      - "8001:80"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=https://api.helpeconomia.com.br
    depends_on:
      - backend
    networks:
      - nginx-proxy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - .:/app
      - /app/node_modules
    restart: always

networks:
  helpeconomia_internal:
    driver: bridge

  nginx-proxy-network:
    external: true

volumes:
  mysql_data_prod:
